<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0" />
      <stop offset="35%" stop-color="#DC2626" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1" />
      <stop offset="65%" stop-color="#DC2626" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Line -->
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dividerGrad)" stroke-width="1.5" />
  <!-- Center Glow and Node -->
  <circle cx="600" cy="12" r="8" fill="url(#nodeGlow)" />
  <rect x="597" y="9" width="6" height="6" fill="#EF4444" transform="rotate(45 600 12)" />
