<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Academic Search | Semester 5 SSASIT</title>
  <meta name="description" content="Instant multi-index search across Semester 5 questions, syllabus topics, formulas, laboratory practicals, and academic guidelines.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-slate-950">

  <div class="ambient-bg"></div>
  <div class="ambient-grid"></div>

  <div id="navbar-container"></div>
  <div id="breadcrumbs-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- Search Header -->
    <header class="glass-panel rounded-3xl p-6 sm:p-10 border border-slate-800 space-y-5">
      <div class="space-y-2">
        <span class="px-2.5 py-0.5 rounded-full font-mono text-xs font-bold bg-sky-500/10 text-sky-400 border border-sky-500/30">
          INDEXED MULTI-SEARCH
        </span>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-100 tracking-tight">
          Instant Knowledge Search Engine
        </h1>
        <p class="text-xs sm:text-sm text-slate-300 max-w-2xl leading-relaxed">
          Search across 113+ viva questions & answers, 37 syllabus unit modules, laboratory practical manuals, and rapid revision cheat-sheets simultaneously.
        </p>
      </div>

      <!-- Main Big Search Input -->
      <div class="relative max-w-3xl">
        <span class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-xl text-sky-400">🔍</span>
        <input 
          type="text" 
          id="global-search-input" 
          autofocus
          placeholder="Type any keyword or concept (e.g. 8085, TCP, Dijkstra, WBS, Pandas, Macro)..." 
          class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-900/90 border border-slate-700/80 focus:border-sky-500 text-sm sm:text-base text-slate-100 placeholder:text-slate-400 focus:outline-none shadow-xl focus:ring-2 focus:ring-sky-500/20 transition-all font-medium"
        >
      </div>

      <!-- Quick Search Suggestions Chips -->
      <div class="flex flex-wrap items-center gap-2 pt-1 text-xs font-mono">
        <span class="text-slate-400 text-[11px]">Popular Searches:</span>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="8085">8085 Pins</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="TCP">TCP 3-Way Handshake</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="WBS">WBS</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="Assembler">Two Pass Assembler</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="PHP">PHP Sessions</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="NumPy">NumPy vs List</button>
        <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-sky-400 border border-slate-800" data-term="Subnetting">Subnetting Formula</button>
      </div>

      <!-- Scope Filter Buttons -->
      <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-800/80 font-mono text-xs">
        <button class="search-type-btn px-3.5 py-1.5 rounded-xl bg-sky-500 text-slate-950 font-bold border border-sky-400" data-type="all">
          All Indices
        </button>
        <button class="search-type-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white" data-type="viva">
          ⚡ Viva Q&As Only
        </button>
        <button class="search-type-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white" data-type="syllabus">
          📋 Syllabus Modules
        </button>
        <button class="search-type-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white" data-type="revision">
          🚀 Revision & Formulas
        </button>
        <button class="search-type-btn px-3.5 py-1.5 rounded-xl bg-slate-900 text-slate-400 border border-slate-800 hover:text-white" data-type="practicals">
          🧪 Lab Practicals
        </button>
      </div>
    </header>

    <!-- Search Status Bar -->
    <div class="flex items-center justify-between text-xs font-mono text-slate-400 px-1">
      <span id="search-results-count">Ready to search</span>
      <span>Press <kbd class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-300">/</kbd> anytime to refocus</span>
    </div>

    <!-- Search Results Container -->
    <section class="space-y-3" id="search-results-list">
      <!-- Populated via search.js -->
    </section>

  </main>

  <div id="footer-container"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/search.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.renderNavbar('search');
      window.renderBreadcrumbs([
        { label: 'Search', url: 'search.html' }
      ]);
      window.renderFooter();

      // Initialize global search engine
      window.initGlobalSearch();

      // Quick chips listener
      document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const term = chip.dataset.term;
          const input = document.getElementById('global-search-input');
          if (input) {
            input.value = term;
            input.dispatchEvent(new Event('input'));
            input.focus();
          }
        });
      });
    });
  </script>
</body>
</html>
