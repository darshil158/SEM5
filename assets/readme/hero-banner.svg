<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080F" />
      <stop offset="45%" stop-color="#0B0F19" />
      <stop offset="85%" stop-color="#111625" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Red Ambient Glows -->
    <radialGradient id="redGlowLeft" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#991B1B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redGlowRight" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#7F1D1D" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Crimson Gradient -->
    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="35%" stop-color="#EF4444" />
      <stop offset="70%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="whiteTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Surface -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#techGrid)" />
  <rect width="1200" height="360" rx="16" fill="url(#redGlowLeft)" />
  <rect width="1200" height="360" rx="16" fill="url(#redGlowRight)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Red Accent Top Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#crimsonGradient)" />

  <!-- Decorative Corner Accents -->
  <path d="M 16 35 L 35 16" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 1184 35 L 1165 16" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Department & University Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="460" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#DC2626" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="4.5" fill="#EF4444" />
    <circle cx="16" cy="15" r="8" fill="#DC2626" fill-opacity="0.3" />
    <text x="32" y="19.5" fill="#F8FAFC" class="font-sub" font-size="11.5" font-weight="600" letter-spacing="0.08em">SSASIT COMPUTER ENGINEERING  •  GTU SEMESTER 5  •  AY 2026</text>
  </g>

  <!-- Live Status Pill (Right) -->
  <g transform="translate(1005, 42)">
    <rect x="0" y="0" width="135" height="30" rx="15" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#22C55E" />
    <text x="32" y="19.5" fill="#E4E4E7" class="font-sub" font-size="11.5" font-weight="600" letter-spacing="0.04em">PORTAL READY</text>
  </g>

  <!-- Primary Headline -->
  <text x="60" y="128" fill="url(#whiteTextGrad)" class="font-title" font-size="44">GTU SEMESTER 5 VIVA &amp; EXAM</text>
  <text x="60" y="174" fill="url(#crimsonGradient)" class="font-title" font-size="42">ACADEMIC PREPARATION PORTAL</text>

  <!-- Subtitle -->
  <text x="60" y="210" fill="#94A3B8" class="font-sub" font-size="15" letter-spacing="0.01em">
    The syllabus-grounded academic preparation engine engineered for SSASIT Computer Engineering students.
  </text>
  <text x="60" y="232" fill="#64748B" class="font-sub" font-size="13">
    Complete course coverage • 650+ verified viva model answers • Examiner oral audio simulator • Rapid revision formulas
  </text>

  <!-- 4 Feature Metric Cards at Bottom -->
  <g transform="translate(60, 260)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="255" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="3.5" height="68" rx="1.5" fill="#DC2626" />
      <text x="18" y="28" fill="#F87171" class="font-title" font-size="18">7 Courses</text>
      <text x="18" y="50" fill="#94A3B8" class="font-sub" font-size="11.5">MPI, CN, PDS, SS, WAD, PM, Int.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(275, 0)">
      <rect width="255" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="3.5" height="68" rx="1.5" fill="#DC2626" />
      <text x="18" y="28" fill="#FFFFFF" class="font-title" font-size="18">650+ Q&amp;As</text>
      <text x="18" y="50" fill="#94A3B8" class="font-sub" font-size="11.5">Model Answers &amp; Examiner Tips</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 0)">
      <rect width="255" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="3.5" height="68" rx="1.5" fill="#DC2626" />
      <text x="18" y="28" fill="#F87171" class="font-title" font-size="18">Audio Engine</text>
      <text x="18" y="50" fill="#94A3B8" class="font-sub" font-size="11.5">Web Speech Examiner Cadence</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="3.5" height="68" rx="1.5" fill="#DC2626" />
      <text x="18" y="28" fill="#FFFFFF" class="font-title" font-size="18">Zero Bloat</text>
      <text x="18" y="50" fill="#94A3B8" class="font-sub" font-size="11.5">Pure Vanilla JS • Tailwind • Instant</text>
    </g>
  </g>
</svg>
